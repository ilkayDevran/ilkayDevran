name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8A2BE2&color_dots=#ebedf0,#e9d5ff,#c084fc,#8A2BE2,#5b21b6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF006E&color_dots=#161b22,#3b1f6e,#5b2a9e,#8A2BE2,#3A86FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
