<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami: Senior Data Engineer. Skills: Data Engineering, Real-Time Data, Anomaly Detection, Cloud Cost Cutting, Ai-Powered Products, Llm Platforms, Security, Team Lead &amp; Mentor, Ai Dev Harness, Aws + Gcp, Infrastructure As Code, Observability.">
  <defs>
